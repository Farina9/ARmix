<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Experience</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-modal, #a-scene-container { display: none !important; visibility: hidden !important; }
    body { margin: 0; padding: 0; overflow: hidden; }
  </style>
  <script>
    // کامپوننت چرخش خودکار مدل
    AFRAME.registerComponent("auto-turn", {
      schema: { speed: { default: 40 } },
      tick: function (t, dt) {
        if (!dt) return;
        const rot = this.el.getAttribute("rotation");
        this.el.setAttribute("rotation", {
          x: rot.x,
          y: rot.y + (this.data.speed * dt) / 1000,
          z: rot.z
        });
      }
    });

    // کامپوننت چرخش لمسی مدل با لمس صفحه گوشی یا درگ موس
    AFRAME.registerComponent("touch-turn", {
      init: function () {
        let isDown = false, lastX = 0, lastY = 0;
        const onStart = (cx, cy) => { isDown = true; lastX = cx; lastY = cy; };
        const onMove = (cx, cy) => {
          if (!isDown) return;
          const dx = cx - lastX, dy = cy - lastY;
          const rot = this.el.getAttribute("rotation");
          this.el.setAttribute("rotation", {
            x: rot.x - dy * 0.35,
            y: rot.y + dx * 0.35,
            z: rot.z
          });
          lastX = cx; lastY = cy;
        };
        const onEnd = () => { isDown = false; };

        window.addEventListener("touchstart", (e) => { if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        window.addEventListener("touchmove", (e) => { if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        window.addEventListener("touchend", onEnd);

        window.addEventListener("mousedown", (e) => onStart(e.clientX, e.clientY));
        window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
        window.addEventListener("mouseup", onEnd);
      }
    });

    // کنترل هوشمند شروع و توقف پخش مدیا (ویدئو و صوت) هنگام دیده‌شدن تارگت
    AFRAME.registerComponent("media-controller", {
      schema: { type: { default: "video" }, loop: { default: true } },
      init: function () {
        const el = this.el;
        const targetEntity = el.closest("[mindar-image-target]");
        if (!targetEntity) return;

        let videoEl = null;
        if (this.data.type === "video") {
          videoEl = document.createElement("video");
          videoEl.src = el.getAttribute("src");
          videoEl.crossOrigin = "anonymous";
          videoEl.loop = this.data.loop;
          videoEl.playsInline = true;
          videoEl.muted = false;
          const texture = new THREE.VideoTexture(videoEl);
          el.addEventListener("loaded", () => {
            const mesh = el.getObject3D("mesh");
            if (mesh && mesh.material) {
              mesh.material.map = texture;
              mesh.material.needsUpdate = true;
            }
          });
        }

        targetEntity.addEventListener("targetFound", () => {
          if (this.data.type === "video" && videoEl) videoEl.play();
          if (this.data.type === "audio" && el.components.sound) el.components.sound.playSound();
        });

        targetEntity.addEventListener("targetLost", () => {
          if (this.data.type === "video" && videoEl) videoEl.pause();
          if (this.data.type === "audio" && el.components.sound) el.components.sound.pauseSound();
        });
      }
    });
  </script>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity mindar-image-target="targetIndex: 0">
      
      <a-entity position="0 0 0.1" rotation="0 0 0" scale="0.5 0.5 0.5" auto-turn="speed: 40" touch-turn>
        <a-gltf-model src="models/model1.glb"></a-gltf-model>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      
      <a-video src="videos/video1.mp4" position="0 0 0.1" width="0.80" height="0.45" material="shader: flat; side: double" media-controller="type: video; loop: true"></a-video>
    </a-entity>
  </a-scene>
</body>
</html>
